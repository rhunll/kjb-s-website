<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>规划</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #ffffff;
      --muted: #d0d4dc;
      --accent: #ffffff;
      --line: #2a2f3a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 72px 24px 40px;
    }

    h1 {
      font-size: 2.6rem;
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      gap: 20px;
    }

    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 28px 24px;
    }

    h2 {
      font-size: 1.35rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    p {
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: #7a808c;
      padding-bottom: 32px;
      font-size: 0.9rem;
    }

    .checkin {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .checkin h3 {
      font-size: 1.05rem;
      margin-bottom: 14px;
      color: #ffffff;
      letter-spacing: 0.06em;
    }

    .checkin-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .field label {
      font-size: 0.85rem;
      color: #ffffff;
    }

    .history-btn {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      line-height: 1.4;
    }

    .history-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .field input {
      width: 100%;
      background: #12151b;
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      outline: none;
    }

    .field input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
    }

    .checkin-btn {
      background: #ffffff;
      color: #12151b;
      border: 1px solid #ffffff;
      border-radius: 10px;
      padding: 11px 22px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
    }

    .checkin-btn:hover {
      background: #f0f0f0;
    }

      display: grid;
      grid-template-columns: 1fr 1fr;
