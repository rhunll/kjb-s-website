<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>规划</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #f5f5f5;
      --muted: #b8bdc7;
      --accent: #7eb8ff;
      --line: #2a2f3a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 72px 24px 40px;
    }

    h1 {
      font-size: 2.6rem;
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      gap: 20px;
    }

    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 28px 24px;
    }

    h2 {
      font-size: 1.35rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    p {
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: #7a808c;
      padding-bottom: 32px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>规划</h1>
    <p class="subtitle">记录这一年的训练、学习和想法</p>
  </header>

  <main>
    <section>
      <h2>目标CUBAL</h2>
      <p>坚持球场上的基本功：运球、投篮、防守和体能。用每一次训练把大一过得更有节奏。</p>
    </section>

    <section>
      <h2>供应链学习</h2>
      <p>从采购、库存到物流配送，理解货物如何流动。把课堂知识连成一条完整的供应链。</p>
    </section>

    <section>
      <h2>2026年赚到第一笔钱</h2>
      <p>观察身边的需求和机会，记下值得尝试的点子。用小实验验证，而不是只停留在想象里。</p>
    </section>
  </main>

  <footer>规划 · 个人主页</footer>
</body>
</html>
