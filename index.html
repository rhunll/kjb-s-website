<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>规划</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #f5f5f5;
      --muted: #b8bdc7;
      --accent: #7eb8ff;
      --line: #2a2f3a;
      --orange: #ff7a18;
      --orange-dark: #e2650d;
      --orange-soft: rgba(255, 122, 24, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 72px 24px 40px;
    }

    h1 {
      font-size: 2.6rem;
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      gap: 20px;
    }

    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 28px 24px;
    }

    h2 {
      font-size: 1.35rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    p {
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: #7a808c;
      padding-bottom: 32px;
      font-size: 0.9rem;
    }

    .checkin {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .checkin h3 {
      font-size: 1.05rem;
      margin-bottom: 14px;
      color: var(--orange);
      letter-spacing: 0.06em;
    }

    .checkin-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.85rem;
      color: #d8dde6;
    }

    .field input {
      width: 100%;
      background: #12151b;
      color: var(--text);
      border: 1px solid var(--orange);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      outline: none;
    }

    .field input:focus {
      box-shadow: 0 0 0 3px var(--orange-soft);
    }

    .checkin-btn {
      background: linear-gradient(180deg, #ff8a2b, var(--orange-dark));
      color: #1a1008;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
    }

    .checkin-btn:hover {
      filter: brightness(1.08);
    }

    .stats-panel {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: linear-gradient(180deg, #1f242e, #171b22);
      border: 1px solid #3a2a1c;
      border-radius: 14px;
      padding: 16px;
    }

    .stat {
      background: var(--orange-soft);
      border: 1px solid rgba(255, 122, 24, 0.35);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 0.82rem;
      color: #f0c9a6;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--orange);
      line-height: 1.3;
    }

    .clear-btn {
      margin-top: 12px;
      background: transparent;
      color: #c9a07a;
      border: 1px solid #5a3d24;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .clear-btn:hover {
      color: var(--orange);
      border-color: var(--orange);
    }

    .checkin-hint {
      margin-top: 8px;
      font-size: 0.82rem;
      min-height: 1.4em;
      color: #f0c9a6;
    }

    @media (max-width: 700px) {
      .checkin-form,
      .stats-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>规划</h1>
    <p class="subtitle">记录这一年的训练、学习和想法</p>
  </header>

  <main>
    <section>
      <h2>目标CUBAL</h2>
      <p>坚持球场上的基本功：运球、投篮、防守和体能。用每一次训练把大一过得更有节奏。</p>

      <div class="checkin">
        <h3>篮球训练打卡</h3>
        <form id="checkin-form" class="checkin-form">
          <div class="field">
            <label for="minutes">训练时长（分钟）</label>
            <input id="minutes" name="minutes" type="number" min="1" step="1" required placeholder="例如 90">
          </div>
          <div class="field">
            <label for="shots">投篮次数</label>
            <input id="shots" name="shots" type="number" min="0" step="1" required placeholder="例如 200">
          </div>
          <button class="checkin-btn" type="submit">打卡</button>
        </form>

        <div class="stats-panel">
          <div class="stat">
            <div class="stat-label">本周总训练时长</div>
            <div class="stat-value"><span id="week-minutes">0</span> 分钟</div>
          </div>
          <div class="stat">
            <div class="stat-label">本周总投篮次数</div>
            <div class="stat-value"><span id="week-shots">0</span> 次</div>
          </div>
        </div>

        <button class="clear-btn" id="clear-week" type="button">清空本周记录</button>
        <p class="checkin-hint" id="checkin-hint"></p>
      </div>
    </section>

    <section>
      <h2>供应链学习</h2>
      <p>从采购、库存到物流配送，理解货物如何流动。把课堂知识连成一条完整的供应链。</p>
    </section>

    <section>
      <h2>2026年赚到第一笔钱</h2>
      <p>观察身边的需求和机会，记下值得尝试的点子。用小实验验证，而不是只停留在想象里。</p>
    </section>
  </main>

  <footer>规划 · 个人主页</footer>

  <script>
    const STORAGE_KEY = "basketballCheckins";

    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = day === 0 ? 6 : day - 1;
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - diff);
      return d;
    }

    function loadRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : [];
        return Array.isArray(data) ? data : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function weekTotals(records) {
      const start = getWeekStart(new Date()).getTime();
      return records.reduce(
        function (acc, item) {
          const t = new Date(item.at).getTime();
          if (t >= start) {
            acc.minutes += Number(item.minutes) || 0;
            acc.shots += Number(item.shots) || 0;
          }
          return acc;
        },
        { minutes: 0, shots: 0 }
      );
    }

    function render() {
      const totals = weekTotals(loadRecords());
      document.getElementById("week-minutes").textContent = totals.minutes;
      document.getElementById("week-shots").textContent = totals.shots;
    }

    document.getElementById("checkin-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const minutes = Number(document.getElementById("minutes").value);
      const shots = Number(document.getElementById("shots").value);
      if (!Number.isFinite(minutes) || minutes <= 0 || !Number.isFinite(shots) || shots < 0) {
        document.getElementById("checkin-hint").textContent = "请输入有效的训练时长和投篮次数。";
        return;
      }

      const records = loadRecords();
      records.push({ minutes: minutes, shots: shots, at: new Date().toISOString() });
      saveRecords(records);
      render();
      event.target.reset();
      document.getElementById("checkin-hint").textContent = "打卡成功，本周数据已更新。";
    });

    document.getElementById("clear-week").addEventListener("click", function () {
      if (!confirm("确定清空本周的篮球训练记录吗？此操作不可恢复。")) {
        return;
      }
      const start = getWeekStart(new Date()).getTime();
      const kept = loadRecords().filter(function (item) {
        return new Date(item.at).getTime() < start;
      });
      saveRecords(kept);
      render();
      document.getElementById("checkin-hint").textContent = "本周记录已清空。";
    });

    render();
  </script>
</body>
</html>
